services:
  - type: web
    name: acelerik-demo
    runtime: docker
    plan: free
    region: frankfurt
    repo: https://github.com/cvidaal/acelerik-demo
    branch: codex/deploy-demo
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: DEMO_USERNAME
        value: demo
      - key: DEMO_PASSWORD
        generateValue: true
# STRIPE_WEBHOOK_SECRET is configured after Render assigns the HTTPS URL.
# Until then the webhook returns 503 and no payment can be confirmed.
